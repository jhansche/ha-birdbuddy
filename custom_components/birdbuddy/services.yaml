collect_postcard:
  name: Collect a Postcard
  description: Collect a Bird Buddy postcard into your Collections.
  fields:
    postcard_id:
      name: Postcard ID
      description: The feed-item id of the postcard to collect. From the
        birdbuddy_new_postcard event this is `.postcard_id`.
      required: true
      example: "{{ trigger.event.data.postcard_id }}"
      selector:
        text:
    feeder_id:
      name: Feeder ID
      description: The Bird Buddy feeder id, used to pick the account when
        more than one is configured. From the event this is `.feeder_id`.
      required: false
      example: "{{ trigger.event.data.feeder_id }}"
      selector:
        text:
    share:
      name: Share media
      description: Whether the collected media is also shared with the
        Bird Buddy community.
      required: false
      default: false
      example: false
      selector:
        boolean:

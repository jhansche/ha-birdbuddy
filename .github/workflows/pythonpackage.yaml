name: Python package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
          cache: pip
      # make lint runs markdownlint through npx, which needs Node.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install dependencies
        run: make deps
      - name: Lint, type check, and test
        run: make check
